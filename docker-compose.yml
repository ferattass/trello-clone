services:
  db:
    image: postgres:16
    container_name: trelloclone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trelloclone
    ports:
      - "5432:5432"
    volumes:
      - trelloclone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trelloclone"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trelloclone_pgdata:

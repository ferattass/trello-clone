# Render Blueprint — backend servisi + PostgreSQL veritabani.
# Render'da "New > Blueprint" deyip bu repoyu secince ikisini birden kurar.
databases:
  - name: flowboard-db
    databaseName: flowboard
    plan: free

services:
  - type: web
    name: flowboard-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      # Veritabani baglantisi Render Postgres'ten otomatik alinir
      - key: DATABASE_URL
        fromDatabase:
          name: flowboard-db
          property: connectionString
      # JWT anahtari Render tarafindan rastgele uretilir
      - key: JWT_SECRET
        generateValue: true
      # Asagidakiler deploy sonrasi panelden doldurulur (Vercel adresin)
      - key: CLIENT_URL
        sync: false
      - key: APP_URL
        sync: false
